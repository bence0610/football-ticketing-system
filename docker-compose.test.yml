services:
  mysql-test:
    image: mysql:8.0-debian
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      MYSQL_DATABASE: kte_jegyportal_test
    ports:
      - "3307:3306"
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -u
        - root
        - -ptestroot
        - --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
